<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061416">
  <meta name="description" content="לוח תוצאות חי לניהול משחק כדורגל, שעון ואירועים">
  <title>לוח תוצאות כדורגל</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061416;font-family:Heebo,Arial Hebrew,Arial,sans-serif}.app-frame{display:block;width:100%;height:100%;border:0;background:#061416}.report-launch{position:fixed;z-index:100;left:22px;bottom:22px;min-height:50px;padding:0 19px;border:1px solid #38bdf838;border-radius:14px;color:#fff;background:linear-gradient(135deg,#173c43,#0d2a2f);box-shadow:0 12px 28px #0008;font-weight:800;font-size:15px;cursor:pointer;display:none;align-items:center;gap:8px}.report-launch.visible{display:flex}.report-launch:hover{filter:brightness(1.1);transform:translateY(-1px)}.report-launch span{font-size:18px}.report-backdrop{position:fixed;z-index:200;inset:0;display:none;place-items:center;padding:20px;background:#01090ad9;backdrop-filter:blur(10px)}.report-backdrop.open{display:grid}.report-sheet{position:relative;width:min(760px,100%);max-height:calc(100vh - 30px);overflow:auto;border:1px solid #ffffff21;border-radius:26px;padding:30px;color:#f8fafc;background:#0c2528;box-shadow:0 28px 80px #0009}.report-close{position:absolute;left:20px;top:18px;width:36px;height:36px;border:0;border-radius:10px;color:#9cadaf;background:#ffffff0e;font-size:24px;cursor:pointer}.report-eyebrow{margin:0 0 6px;color:#6ee7a1;letter-spacing:.19em;direction:ltr;font-size:12px;font-weight:800}.report-sheet h2{margin:0 0 22px;font-size:28px}.report-score-card{border:1px solid #6ee7a126;border-radius:24px;padding:24px;background:linear-gradient(135deg,#112f2bf2,#07171afa)}.report-stage{text-align:center;color:#9af0b9;font-size:13px;font-weight:700}.report-date{text-align:center;color:#d7e2e6;margin-top:6px;font-size:14px;font-weight:700}.report-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;margin-top:12px}.report-team{text-align:center;min-width:0}.report-team .swatch{display:block;width:32px;height:4px;margin:0 auto 10px;border-radius:10px}.report-team strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:21px}.report-number{font-size:56px;font-weight:900;line-height:1;direction:ltr}.report-clock{text-align:center;color:#9aa9b8;margin-top:12px;font-size:13px}.report-events{margin-top:20px}.report-events-header{display:flex;justify-content:space-between;align-items:end;padding-bottom:12px;border-bottom:1px solid #ffffff17}.report-events-header h3{margin:0;font-size:20px}.report-events-header span{color:#8fa0a7;font-size:12px}.report-event{display:grid;grid-template-columns:54px 34px 1fr;gap:10px;align-items:center;min-height:62px;border-bottom:1px solid #ffffff12}.report-event:last-child{border-bottom:0}.report-minute{text-align:center;color:#a8b8be;font-weight:800;direction:ltr}.report-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#ffffff0f}.report-copy strong{display:block;font-size:14px}.report-copy small{display:block;margin-top:2px;color:#82949c;font-size:12px}.report-empty{text-align:center;color:#7f939b;padding:30px 10px}.report-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.report-actions button{min-height:50px;border-radius:14px;border:1px solid #ffffff1c;color:#fff;background:#ffffff0d;font-weight:800;cursor:pointer}.report-actions .primary{border:0;background:linear-gradient(135deg,#27c963,#15924a)}.report-actions .share{border-color:#38bdf850;background:#173c43}.report-actions button:hover{filter:brightness(1.08)}.report-actions button[hidden]{display:none}.report-note{text-align:center;color:#7f939b;font-size:11px;margin:12px 0 0}@media(max-width:650px){.report-launch{left:12px;bottom:12px;padding:0 14px}.report-sheet{padding:25px 17px 20px;border-radius:22px}.report-score{gap:10px}.report-team strong{font-size:17px}.report-number{font-size:45px}.report-actions{grid-template-columns:1fr}.report-event{grid-template-columns:46px 30px 1fr;gap:7px}}
  </style>
</head>
<body>
  <iframe id="appFrame" class="app-frame" src="app-original.html" title="לוח תוצאות כדורגל"></iframe>
  <button id="reportLaunch" class="report-launch" type="button"><span>▤</span> סיכום משחק</button>
  <div id="reportBackdrop" class="report-backdrop" aria-hidden="true">
    <section class="report-sheet" role="dialog" aria-modal="true" aria-labelledby="reportTitle">
      <button id="reportClose" class="report-close" type="button" aria-label="סגירה">×</button>
      <p class="report-eyebrow">MATCH REPORT</p>
      <h2 id="reportTitle">סיכום משחק</h2>
      <div id="reportContent"></div>
      <div class="report-actions">
        <button id="shareImage" class="share" type="button">↗ שמירה / שיתוף תמונה</button>
        <button id="downloadPng" class="primary" type="button">⬇ הורדת תמונה</button>
        <button id="downloadCsv" type="button">▦ הורדת טבלה</button>
        <button id="printReport" type="button">▣ הדפסה / PDF</button>
      </div>
      <p class="report-note">במכשיר נייד, “שמירה / שיתוף תמונה” פותח את תפריט המערכת. אם המכשיר מאפשר זאת ניתן לבחור שמירה לתמונות / גלריה.</p>
    </section>
  </div>
  <script>
    (()=>{
      const STORAGE_KEY='football-scoreboard-v2';
      const DATE_KEY='football-scoreboard-match-date-v1';
      const launch=document.getElementById('reportLaunch');
      const backdrop=document.getElementById('reportBackdrop');
      const content=document.getElementById('reportContent');
      const shareButton=document.getElementById('shareImage');
      const stageNames={first:'מחצית ראשונה',second:'מחצית שנייה',extra1:'הארכה ראשונה',extra2:'הארכה שנייה'};
      const kindIcons={goal:'⚽',yellow:'▮',red:'▮',sub:'⇄',stage:'◷',note:'•'};
      const kindNames={goal:'שער',yellow:'כרטיס צהוב',red:'כרטיס אדום',sub:'חילוף',stage:'שלב משחק',note:'הערה'};
      const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const readMatch=()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch{return null}};
      const chronological=events=>(events||[]).slice().reverse();
      const formatClock=sec=>{sec=Math.max(0,Number(sec)||0);const m=Math.floor(sec/60).toString().padStart(2,'0'),s=Math.floor(sec%60).toString().padStart(2,'0');return `${m}:${s}`};
      const localDateKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
      function ensureMatchDate(){const d=readMatch();if(!d||d.screen!=='match'){if(d&&d.screen==='setup')localStorage.removeItem(DATE_KEY);return null}let value=localStorage.getItem(DATE_KEY);if(!value){value=localDateKey();localStorage.setItem(DATE_KEY,value)}return value}
      function getMatchDate(){return ensureMatchDate()||localDateKey()}
      function parseMatchDate(value){const [y,m,d]=String(value).split('-').map(Number);return new Date(y,m-1,d)}
      function formatDate(value){const [y,m,d]=String(value).split('-');return `${d}/${m}/${y}`}
      function formatDay(value){try{return new Intl.DateTimeFormat('he-IL',{weekday:'long'}).format(parseMatchDate(value))}catch{return ''}}
      function fullDate(value){const day=formatDay(value);return `${day?day+' · ':''}${formatDate(value)}`}
      function updateLaunch(){const d=readMatch();ensureMatchDate();launch.classList.toggle('visible',!!(d&&d.screen==='match'))}
      function reportHtml(d){
        const events=chronological(d.events),date=getMatchDate();
        const rows=events.length?events.map(e=>`<article class="report-event"><div class="report-minute">${escapeHtml(e.minute||'—')}</div><div class="report-icon">${kindIcons[e.kind]||'•'}</div><div class="report-copy"><strong>${escapeHtml(e.title||kindNames[e.kind]||'אירוע')}</strong>${e.detail?`<small>${escapeHtml(e.detail)}</small>`:''}</div></article>`).join(''):'<div class="report-empty">לא נרשמו אירועים במשחק.</div>';
        return `<div class="report-score-card"><div class="report-stage">${escapeHtml(stageNames[d.stage]||'משחק')}</div><div class="report-date">${escapeHtml(fullDate(date))}</div><div class="report-score"><div class="report-team"><span class="swatch" style="background:${escapeHtml(d.home?.color||'#22c55e')}"></span><strong>${escapeHtml(d.home?.name||'קבוצת בית')}</strong></div><div class="report-number">${Number(d.homeScore)||0} : ${Number(d.awayScore)||0}</div><div class="report-team"><span class="swatch" style="background:${escapeHtml(d.away?.color||'#38bdf8')}"></span><strong>${escapeHtml(d.away?.name||'קבוצת חוץ')}</strong></div></div><div class="report-clock">זמן משחק: ${formatClock(d.elapsed)} · ${escapeHtml(stageNames[d.stage]||'')}</div></div><section class="report-events"><div class="report-events-header"><h3>אירועי המשחק</h3><span>${events.length} אירועים</span></div>${rows}</section>`;
      }
      function openReport(){const d=readMatch();if(!d||d.screen!=='match')return;content.innerHTML=reportHtml(d);backdrop.classList.add('open');backdrop.setAttribute('aria-hidden','false')}
      function closeReport(){backdrop.classList.remove('open');backdrop.setAttribute('aria-hidden','true')}
      function csvCell(v){return `"${String(v??'').replace(/"/g,'""')}"`}
      function safeName(v){return String(v||'team').trim().replace(/[^\p{L}\p{N}-]+/gu,'-').replace(/^-+|-+$/g,'')||'team'}
      function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
      function downloadCsv(){const d=readMatch();if(!d)return;const date=getMatchDate(),rows=[['תאריך','דקה','קבוצה','סוג אירוע','כותרת','פירוט']];chronological(d.events).forEach(e=>rows.push([formatDate(date),e.minute||'',e.team==='home'?d.home?.name||'קבוצת בית':e.team==='away'?d.away?.name||'קבוצת חוץ':'',kindNames[e.kind]||e.kind||'',e.title||'',e.detail||'']));const csv='\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});downloadBlob(blob,`match-${formatDate(date).replaceAll('/','-')}-${safeName(d.home?.name)}-${safeName(d.away?.name)}.csv`)}
      function roundRect(ctx,x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill()}
      function fitText(ctx,text,maxWidth,startSize,minSize=20){let size=startSize;while(size>minSize){ctx.font=`800 ${size}px Arial`;if(ctx.measureText(text).width<=maxWidth)break;size-=2}return size}
      function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines=2){const parts=String(text||'').split(/\s+/);let line='',lines=[];for(const word of parts){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word;if(lines.length===maxLines-1)break}else line=test}if(line&&lines.length<maxLines)lines.push(line);lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));return lines.length}
      function makePngBlob(){
        return new Promise(resolve=>{
          const d=readMatch();if(!d){resolve(null);return}const events=chronological(d.events),date=getMatchDate();const W=1200,rowH=96,baseH=545,H=Math.max(795,baseH+Math.max(1,events.length)*rowH+90);const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const c=canvas.getContext('2d');c.textBaseline='middle';c.direction='rtl';
          const grad=c.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#112f2b');grad.addColorStop(1,'#061416');c.fillStyle=grad;c.fillRect(0,0,W,H);c.fillStyle='#22c55e';c.fillRect(0,0,W,12);
          c.textAlign='center';c.fillStyle='#6ee7a1';c.font='800 24px Arial';c.fillText('MATCH REPORT',W/2,62);c.fillStyle='#f8fafc';c.font='900 42px Arial';c.fillText('סיכום משחק',W/2,116);c.fillStyle='#9aa9b8';c.font='700 24px Arial';c.fillText(stageNames[d.stage]||'משחק',W/2,158);c.fillStyle='#d7e2e6';c.font='700 23px Arial';c.fillText(fullDate(date),W/2,194);
          roundRect(c,70,230,W-140,245,30,'#0a2022');c.strokeStyle='#6ee7a126';c.lineWidth=2;c.strokeRect(72,232,W-144,241);
          const home=d.home?.name||'קבוצת בית',away=d.away?.name||'קבוצת חוץ';c.fillStyle=d.home?.color||'#22c55e';c.fillRect(160,280,115,8);c.fillStyle=d.away?.color||'#38bdf8';c.fillRect(W-275,280,115,8);
          c.fillStyle='#f8fafc';let sz=fitText(c,home,300,36,24);c.font=`800 ${sz}px Arial`;c.fillText(home,220,330);sz=fitText(c,away,300,36,24);c.font=`800 ${sz}px Arial`;c.fillText(away,W-220,330);c.font='900 92px Arial';c.fillText(`${Number(d.homeScore)||0} : ${Number(d.awayScore)||0}`,W/2,350);c.fillStyle='#9aa9b8';c.font='700 24px Arial';c.fillText(`זמן משחק ${formatClock(d.elapsed)}`,W/2,430);
          c.textAlign='right';c.fillStyle='#f8fafc';c.font='900 34px Arial';c.fillText('אירועי המשחק',W-85,540);c.textAlign='left';c.fillStyle='#8fa0a7';c.font='700 22px Arial';c.fillText(`${events.length} אירועים`,85,540);
          if(!events.length){c.textAlign='center';c.fillStyle='#7f939b';c.font='700 28px Arial';c.fillText('לא נרשמו אירועים במשחק',W/2,645)}else events.forEach((e,i)=>{const y=600+i*rowH;c.fillStyle=i%2?'#ffffff08':'#ffffff04';c.fillRect(70,y-34,W-140,rowH-6);c.textAlign='center';c.fillStyle='#a8b8be';c.font='800 25px Arial';c.fillText(e.minute||'—',W-120,y+2);c.fillStyle=e.kind==='red'?'#ef4444':e.kind==='yellow'?'#facc15':'#f8fafc';c.font='32px Arial';c.fillText(kindIcons[e.kind]||'•',W-205,y+2);c.textAlign='right';c.fillStyle='#f8fafc';c.font='800 25px Arial';wrapText(c,e.title||kindNames[e.kind]||'אירוע',W-260,y-7,760,28,1);if(e.detail){c.fillStyle='#82949c';c.font='500 20px Arial';wrapText(c,e.detail,W-260,y+25,760,24,1)}});
          c.textAlign='center';c.fillStyle='#62757d';c.font='600 18px Arial';c.fillText('נוצר באמצעות לוח תוצאות כדורגל',W/2,H-32);canvas.toBlob(resolve,'image/png')
        })
      }
      async function downloadPng(){const d=readMatch();if(!d)return;const blob=await makePngBlob();if(!blob)return;const date=getMatchDate();downloadBlob(blob,`match-${formatDate(date).replaceAll('/','-')}-${safeName(d.home?.name)}-${safeName(d.away?.name)}.png`)}
      async function shareImage(){const d=readMatch();if(!d)return;const blob=await makePngBlob();if(!blob)return;const date=getMatchDate(),file=new File([blob],`match-${formatDate(date).replaceAll('/','-')}-${safeName(d.home?.name)}-${safeName(d.away?.name)}.png`,{type:'image/png'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){try{await navigator.share({files:[file],title:`${d.home?.name||'קבוצת בית'} ${Number(d.homeScore)||0}:${Number(d.awayScore)||0} ${d.away?.name||'קבוצת חוץ'}`,text:`סיכום משחק · ${fullDate(date)}`});return}catch(e){if(e&&e.name==='AbortError')return}}downloadBlob(blob,file.name)}
      function printReport(){const d=readMatch();if(!d)return;const date=getMatchDate(),w=window.open('','_blank','width=900,height=900');if(!w)return;const events=chronological(d.events);const rows=events.map(e=>`<tr><td>${escapeHtml(e.minute||'')}</td><td>${escapeHtml(e.team==='home'?d.home?.name||'':e.team==='away'?d.away?.name||'':'')}</td><td>${escapeHtml(kindNames[e.kind]||e.kind||'')}</td><td>${escapeHtml(e.title||'')}</td><td>${escapeHtml(e.detail||'')}</td></tr>`).join('');w.document.write(`<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>סיכום משחק</title><style>body{font-family:Arial,sans-serif;color:#16243f;padding:32px}h1{text-align:center;margin-bottom:6px}.score{text-align:center;font-size:38px;font-weight:900;margin:22px 0}.meta{text-align:center;color:#657087;margin-bottom:8px}.date{text-align:center;font-weight:700;margin-bottom:28px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #d8dde2;padding:9px;text-align:right;font-size:13px}th{background:#eef2f3}.footer{text-align:center;color:#89939c;font-size:11px;margin-top:24px}@media print{body{padding:0}}</style></head><body><h1>${escapeHtml(d.home?.name||'קבוצת בית')} — ${escapeHtml(d.away?.name||'קבוצת חוץ')}</h1><div class="score">${Number(d.homeScore)||0} : ${Number(d.awayScore)||0}</div><div class="meta">${escapeHtml(stageNames[d.stage]||'')} · זמן משחק ${formatClock(d.elapsed)}</div><div class="date">${escapeHtml(fullDate(date))}</div><table><thead><tr><th>דקה</th><th>קבוצה</th><th>אירוע</th><th>כותרת</th><th>פירוט</th></tr></thead><tbody>${rows||'<tr><td colspan="5">לא נרשמו אירועים</td></tr>'}</tbody></table><div class="footer">סיכום משחק — לוח תוצאות כדורגל</div><script>window.onload=()=>setTimeout(()=>window.print(),150)<\/script></body></html>`);w.document.close()}
      if(!(navigator.share&&typeof File!=='undefined'))shareButton.hidden=true;
      launch.addEventListener('click',openReport);document.getElementById('reportClose').addEventListener('click',closeReport);backdrop.addEventListener('mousedown',e=>{if(e.target===backdrop)closeReport()});document.getElementById('downloadCsv').addEventListener('click',downloadCsv);document.getElementById('downloadPng').addEventListener('click',downloadPng);document.getElementById('shareImage').addEventListener('click',shareImage);document.getElementById('printReport').addEventListener('click',printReport);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeReport()});window.addEventListener('storage',updateLaunch);setInterval(updateLaunch,700);updateLaunch();
    })();
  </script>
</body>
</html>
