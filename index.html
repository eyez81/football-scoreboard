<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061416">
  <meta name="description" content="לוח תוצאות חי לניהול משחק כדורגל, שעון ואירועים">
  <title>לוח תוצאות כדורגל</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061416;font-family:Heebo,Arial Hebrew,Arial,sans-serif}.app-frame{display:block;width:100%;height:100%;border:0;background:#061416}.report-launch{position:fixed;z-index:100;left:22px;bottom:22px;min-height:50px;padding:0 19px;border:1px solid #38bdf838;border-radius:14px;color:#fff;background:linear-gradient(135deg,#173c43,#0d2a2f);box-shadow:0 12px 28px #0008;font-weight:800;font-size:15px;cursor:pointer;display:none;align-items:center;gap:8px}.report-launch.visible{display:flex}.report-launch:hover{filter:brightness(1.1);transform:translateY(-1px)}.report-launch span{font-size:18px}.report-backdrop,.confirm-backdrop{position:fixed;z-index:200;inset:0;display:none;place-items:center;padding:20px;background:#01090ad9;backdrop-filter:blur(10px)}.report-backdrop.open,.confirm-backdrop.open{display:grid}.report-sheet{position:relative;width:min(780px,100%);max-height:calc(100vh - 30px);overflow:auto;border:1px solid #ffffff21;border-radius:26px;padding:30px;color:#f8fafc;background:#0c2528;box-shadow:0 28px 80px #0009}.report-close{position:absolute;left:20px;top:18px;width:36px;height:36px;border:0;border-radius:10px;color:#9cadaf;background:#ffffff0e;font-size:24px;cursor:pointer}.report-eyebrow{margin:0 0 6px;color:#6ee7a1;letter-spacing:.19em;direction:ltr;font-size:12px;font-weight:800}.report-sheet h2{margin:0 0 22px;font-size:28px}.report-score-card{border:1px solid #6ee7a126;border-radius:24px;padding:24px;background:linear-gradient(135deg,#112f2bf2,#07171afa)}.report-stage{text-align:center;color:#9af0b9;font-size:13px;font-weight:800}.report-date{text-align:center;color:#d7e2e6;margin-top:6px;font-size:14px;font-weight:700}.report-score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;margin-top:16px;direction:ltr}.report-team{text-align:center;min-width:0;direction:rtl}.report-team-logo{width:58px;height:58px;object-fit:contain;display:block;margin:0 auto 8px}.report-team .swatch{display:block;width:38px;height:4px;margin:0 auto 9px;border-radius:10px}.report-team strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:20px}.report-number{font-size:54px;font-weight:900;line-height:1;direction:ltr;white-space:nowrap}.report-clock{text-align:center;color:#9aa9b8;margin-top:14px;font-size:13px}.report-events{margin-top:20px}.report-events-header{display:flex;justify-content:space-between;align-items:end;padding-bottom:12px;border-bottom:1px solid #ffffff17}.report-events-header h3{margin:0;font-size:20px}.report-events-header span{color:#8fa0a7;font-size:12px}.timeline{position:relative;padding:10px 0}.timeline:before{content:"";position:absolute;top:10px;bottom:10px;left:50%;width:1px;background:#ffffff25;transform:translateX(-50%)}.timeline-row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);min-height:72px;align-items:center;direction:ltr}.timeline-minute{position:relative;z-index:1;justify-self:center;min-width:48px;padding:4px 6px;text-align:center;background:#0c2528;color:#b9c6ca;font-size:13px;font-weight:800;direction:ltr}.timeline-event{display:flex;align-items:center;gap:8px;min-width:0;direction:rtl}.timeline-event.away{grid-column:1;justify-content:flex-end;text-align:right;padding-right:12px}.timeline-event.home{grid-column:3;justify-content:flex-start;text-align:right;padding-left:12px}.timeline-icon{flex:0 0 32px;width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#ffffff0f;font-size:17px}.timeline-copy{min-width:0}.timeline-copy strong{display:block;font-size:13px;line-height:1.25}.timeline-copy small{display:block;margin-top:3px;color:#82949c;font-size:11px;line-height:1.3}.timeline-stage{grid-column:1/4;position:relative;z-index:2;justify-self:center;padding:5px 15px;border:1px solid #ffffff34;border-radius:999px;color:#dbe5e8;background:#061416;font-size:12px;font-weight:800;direction:rtl}.report-empty{text-align:center;color:#7f939b;padding:30px 10px}.report-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.report-actions button{min-height:50px;border-radius:14px;border:1px solid #ffffff1c;color:#fff;background:#ffffff0d;font-weight:800;cursor:pointer}.report-actions .primary{border:0;background:linear-gradient(135deg,#27c963,#15924a)}.report-actions .share{border-color:#38bdf850;background:#173c43}.report-actions button:hover{filter:brightness(1.08)}.report-actions button[hidden]{display:none}.report-note{text-align:center;color:#7f939b;font-size:11px;margin:12px 0 0}.confirm-card{width:min(420px,100%);border:1px solid #ffffff20;border-radius:24px;background:#0c2528;color:#fff;padding:28px;box-shadow:0 28px 70px #000a;text-align:center}.confirm-card .stop-icon{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 12px;border-radius:18px;background:#ef444421;color:#ff9999;font-size:26px}.confirm-card h3{font-size:24px;margin:0 0 8px}.confirm-card p{color:#9aabb0;margin:0 0 22px;line-height:1.6}.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.confirm-actions button{min-height:48px;border-radius:12px;border:1px solid #ffffff20;background:#ffffff0c;color:#fff;font-weight:800;cursor:pointer}.confirm-actions .danger{border:0;background:#d84c4c}.upload-toast{position:fixed;z-index:300;right:50%;bottom:24px;transform:translateX(50%);background:#173c43;color:#fff;border:1px solid #38bdf84c;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.2s}.upload-toast.show{opacity:1}@media(max-width:650px){.report-launch{left:12px;bottom:12px;padding:0 14px}.report-sheet{padding:25px 14px 20px;border-radius:22px}.report-score{gap:7px}.report-team strong{font-size:15px}.report-team-logo{width:46px;height:46px}.report-number{font-size:39px}.report-actions{grid-template-columns:1fr}.timeline-row{grid-template-columns:minmax(0,1fr) 50px minmax(0,1fr);min-height:78px}.timeline-event.away{padding-right:5px}.timeline-event.home{padding-left:5px}.timeline-icon{width:27px;height:27px;flex-basis:27px;font-size:15px}.timeline-copy strong{font-size:12px}.timeline-copy small{font-size:10px}.timeline-minute{min-width:42px;font-size:12px}}
  </style>
</head>
<body>
  <iframe id="appFrame" class="app-frame" src="app-original.html" title="לוח תוצאות כדורגל"></iframe>
  <button id="reportLaunch" class="report-launch" type="button"><span>▤</span> סיכום משחק</button>
  <div id="reportBackdrop" class="report-backdrop" aria-hidden="true">
    <section class="report-sheet" role="dialog" aria-modal="true" aria-labelledby="reportTitle">
      <button id="reportClose" class="report-close" type="button" aria-label="סגירה">×</button>
      <p class="report-eyebrow">MATCH REPORT</p>
      <h2 id="reportTitle">סיכום משחק</h2>
      <div id="reportContent"></div>
      <div class="report-actions">
        <button id="shareImage" class="share" type="button">↗ שמירה / שיתוף תמונה</button>
        <button id="downloadPng" class="primary" type="button">⬇ הורדת תמונה</button>
        <button id="downloadCsv" type="button">▦ הורדת טבלה</button>
        <button id="printReport" type="button">▣ הדפסה / PDF</button>
      </div>
      <p class="report-note">במכשיר נייד, “שמירה / שיתוף תמונה” פותח את תפריט המערכת. אם המכשיר מאפשר זאת ניתן לבחור שמירה לתמונות / גלריה.</p>
    </section>
  </div>
  <div id="endConfirm" class="confirm-backdrop" aria-hidden="true">
    <section class="confirm-card" role="alertdialog" aria-modal="true">
      <div class="stop-icon">■</div><h3>לסיים את המשחק?</h3><p>השעון ייעצר ותוצאת הסיום תישמר. לאחר מכן ייפתח סיכום המשחק.</p>
      <div class="confirm-actions"><button id="cancelEnd" type="button">ביטול</button><button id="confirmEnd" class="danger" type="button">סיום המשחק</button></div>
    </section>
  </div>
  <div id="uploadToast" class="upload-toast">הלוגו נשמר</div>
  <script>
  (()=>{
    const STORAGE_KEY='football-scoreboard-v2',DATE_KEY='football-scoreboard-match-date-v1',META_KEY='football-scoreboard-report-meta-v2',LOGO_KEY='football-scoreboard-team-logos-v1';
    const frame=document.getElementById('appFrame'),launch=document.getElementById('reportLaunch'),backdrop=document.getElementById('reportBackdrop'),content=document.getElementById('reportContent'),shareButton=document.getElementById('shareImage'),endConfirm=document.getElementById('endConfirm'),toast=document.getElementById('uploadToast');
    const stageNames={first:'מחצית ראשונה',second:'מחצית שנייה',extra1:'הארכה ראשונה',extra2:'הארכה שנייה'},kindIcons={goal:'⚽',yellow:'▮',red:'▮',sub:'⇄',stage:'◷',note:'•'},kindNames={goal:'שער',yellow:'כרטיס צהוב',red:'כרטיס אדום',sub:'חילוף',stage:'שלב משחק',note:'הערה'};
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const readJson=(k,f=null)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}},writeJson=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
    const readMatch=()=>readJson(STORAGE_KEY),logos=()=>readJson(LOGO_KEY,{home:null,away:null}),meta=()=>readJson(META_KEY,{ended:false});
    const chronological=e=>(e||[]).slice().reverse(),formatClock=sec=>{sec=Math.max(0,Number(sec)||0);return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(Math.floor(sec%60)).padStart(2,'0')}`};
    const localDateKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    function ensureDate(){const d=readMatch();if(!d||d.screen!=='match'){if(d&&d.screen==='setup'){localStorage.removeItem(DATE_KEY);writeJson(META_KEY,{ended:false})}return null}let v=localStorage.getItem(DATE_KEY);if(!v){v=localDateKey();localStorage.setItem(DATE_KEY,v)}return v}
    const getDate=()=>ensureDate()||localDateKey(),formatDate=v=>{const [y,m,d]=String(v).split('-');return `${d}/${m}/${y}`},formatDay=v=>{try{const [y,m,d]=String(v).split('-').map(Number);return new Intl.DateTimeFormat('he-IL',{weekday:'long'}).format(new Date(y,m-1,d))}catch{return''}},fullDate=v=>`${formatDay(v)} · ${formatDate(v)}`;
    function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
    function teamLogo(side){return logos()[side]?.dataUrl||''}
    function logoTag(side){const src=teamLogo(side);return src?`<img class="report-team-logo" src="${src}" alt="">`:''}
    function isEnded(){return !!meta().ended}
    function eventTimeline(events){if(!events.length)return '<div class="report-empty">לא נרשמו אירועים במשחק.</div>';return `<div class="timeline">${events.map(e=>{if(e.kind==='stage'||!e.team)return `<div class="timeline-row"><div class="timeline-stage">${esc(e.minute||'')} · ${esc(e.title||kindNames[e.kind]||'שלב משחק')}</div></div>`;const side=e.team==='home'?'home':'away';return `<div class="timeline-row"><div class="timeline-minute">${esc(e.minute||'—')}</div><div class="timeline-event ${side}"><div class="timeline-icon">${kindIcons[e.kind]||'•'}</div><div class="timeline-copy"><strong>${esc(e.title||kindNames[e.kind]||'אירוע')}</strong>${e.detail?`<small>${esc(e.detail)}</small>`:''}</div></div></div>`}).join('')}</div>`}
    function reportHtml(d){const ev=chronological(d.events),date=getDate(),ended=isEnded(),home=d.home||{},away=d.away||{};return `<div class="report-score-card"><div class="report-stage">${ended?'תוצאת סיום':esc(stageNames[d.stage]||'משחק')}</div><div class="report-date">${esc(fullDate(date))}</div><div class="report-score"><div class="report-team">${logoTag('away')}<span class="swatch" style="background:${esc(away.color||'#38bdf8')}"></span><strong>${esc(away.name||'קבוצת חוץ')}</strong></div><div class="report-number">${Number(d.awayScore)||0} : ${Number(d.homeScore)||0}</div><div class="report-team">${logoTag('home')}<span class="swatch" style="background:${esc(home.color||'#22c55e')}"></span><strong>${esc(home.name||'קבוצת בית')}</strong></div></div><div class="report-clock">זמן משחק: ${formatClock(d.elapsed)}${ended?' · המשחק הסתיים':` · ${esc(stageNames[d.stage]||'')}`}</div></div><section class="report-events"><div class="report-events-header"><h3>אירועי המשחק</h3><span>${ev.length} אירועים</span></div>${eventTimeline(ev)}</section>`}
    function openReport(){const d=readMatch();if(!d||d.screen!=='match')return;content.innerHTML=reportHtml(d);backdrop.classList.add('open');backdrop.setAttribute('aria-hidden','false')}
    function closeReport(){backdrop.classList.remove('open');backdrop.setAttribute('aria-hidden','true')}
    function safeName(v){return String(v||'team').trim().replace(/[^\p{L}\p{N}-]+/gu,'-').replace(/^-+|-+$/g,'')||'team'}
    function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
    function csvCell(v){return `"${String(v??'').replace(/"/g,'""')}"`}
    function downloadCsv(){const d=readMatch();if(!d)return;const date=getDate(),rows=[['תאריך','דקה','קבוצה','סוג אירוע','כותרת','פירוט']];chronological(d.events).forEach(e=>rows.push([formatDate(date),e.minute||'',e.team==='home'?d.home?.name||'קבוצת בית':e.team==='away'?d.away?.name||'קבוצת חוץ':'',kindNames[e.kind]||e.kind||'',e.title||'',e.detail||'']));downloadBlob(new Blob(['\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),`match-${formatDate(date).replaceAll('/','-')}-${safeName(d.home?.name)}-${safeName(d.away?.name)}.csv`)}
    const loadImg=src=>new Promise(r=>{if(!src)return r(null);const i=new Image;i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
    function drawContain(c,img,x,y,w,h){if(!img)return;const s=Math.min(w/img.width,h/img.height),dw=img.width*s,dh=img.height*s;c.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh)}
    function wrap(c,text,x,y,max,wLine=28,maxLines=2){const words=String(text||'').split(/\s+/);let line='',lines=[];for(const word of words){const t=line?line+' '+word:word;if(c.measureText(t).width>max&&line){lines.push(line);line=word;if(lines.length===maxLines-1)break}else line=t}if(line&&lines.length<maxLines)lines.push(line);lines.forEach((l,i)=>c.fillText(l,x,y+i*wLine))}
    async function makePngBlob(){const d=readMatch();if(!d)return null;const ev=chronological(d.events),date=getDate(),lg=logos(),[homeLogo,awayLogo]=await Promise.all([loadImg(lg.home?.dataUrl),loadImg(lg.away?.dataUrl)]),W=1200,rowH=106,base=570,H=Math.max(830,base+Math.max(1,ev.length)*rowH+80),cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');c.textBaseline='middle';const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#112f2b');g.addColorStop(1,'#061416');c.fillStyle=g;c.fillRect(0,0,W,H);c.fillStyle='#22c55e';c.fillRect(0,0,W,12);c.textAlign='center';c.fillStyle='#6ee7a1';c.font='800 24px Arial';c.fillText('MATCH REPORT',W/2,58);c.fillStyle='#fff';c.font='900 44px Arial';c.fillText('סיכום משחק',W/2,112);c.fillStyle='#9af0b9';c.font='800 24px Arial';c.fillText(isEnded()?'תוצאת סיום':stageNames[d.stage]||'משחק',W/2,158);c.fillStyle='#d7e2e6';c.font='700 22px Arial';c.fillText(fullDate(date),W/2,195);
      c.fillStyle='#0a2022';c.beginPath();c.roundRect(65,225,W-130,255,30);c.fill();c.strokeStyle='#6ee7a130';c.lineWidth=2;c.stroke();drawContain(c,awayLogo,125,255,90,90);drawContain(c,homeLogo,W-215,255,90,90);c.fillStyle=d.away?.color||'#38bdf8';c.fillRect(130,355,110,8);c.fillStyle=d.home?.color||'#22c55e';c.fillRect(W-240,355,110,8);c.fillStyle='#fff';c.font='800 31px Arial';c.textAlign='center';c.fillText(d.away?.name||'קבוצת חוץ',190,395);c.fillText(d.home?.name||'קבוצת בית',W-190,395);c.font='900 82px Arial';c.direction='ltr';c.fillText(`${Number(d.awayScore)||0} : ${Number(d.homeScore)||0}`,W/2,355);c.direction='rtl';c.fillStyle='#9aa9b8';c.font='700 21px Arial';c.fillText(`זמן משחק ${formatClock(d.elapsed)}`,W/2,445);
      const center=W/2;c.strokeStyle='#ffffff28';c.lineWidth=2;c.beginPath();c.moveTo(center,550);c.lineTo(center,H-70);c.stroke();c.textAlign='right';c.fillStyle='#fff';c.font='900 32px Arial';c.fillText('אירועי המשחק',W-70,520);if(!ev.length){c.textAlign='center';c.fillStyle='#81949a';c.font='700 26px Arial';c.fillText('לא נרשמו אירועים במשחק',center,640)}else ev.forEach((e,i)=>{const y=585+i*rowH;if(e.kind==='stage'||!e.team){c.fillStyle='#061416';c.strokeStyle='#ffffff40';c.lineWidth=1.5;c.beginPath();c.roundRect(center-130,y-22,260,44,22);c.fill();c.stroke();c.textAlign='center';c.fillStyle='#e4ecee';c.font='800 20px Arial';c.fillText(`${e.minute||''}  ${e.title||kindNames[e.kind]||''}`,center,y);return}c.fillStyle='#0c2528';c.fillRect(center-31,y-22,62,44);c.textAlign='center';c.fillStyle='#b8c5c9';c.font='800 21px Arial';c.fillText(e.minute||'—',center,y);const home=e.team==='home',x=home?center+66:center-66,align=home?'left':'right';c.textAlign=align;c.fillStyle=e.kind==='red'?'#ef4444':e.kind==='yellow'?'#facc15':'#fff';c.font='28px Arial';c.fillText(kindIcons[e.kind]||'•',x,y-8);const tx=home?x+42:x-42;c.fillStyle='#fff';c.font='800 22px Arial';c.textAlign=align;wrap(c,e.title||kindNames[e.kind]||'אירוע',tx,y-10,410,25,1);if(e.detail){c.fillStyle='#81949a';c.font='500 17px Arial';wrap(c,e.detail,tx,y+22,410,21,1)}});c.textAlign='center';c.fillStyle='#61747b';c.font='600 17px Arial';c.fillText('נוצר באמצעות לוח תוצאות כדורגל',W/2,H-28);return await new Promise(r=>cv.toBlob(r,'image/png'))}
    async function downloadPng(){const d=readMatch(),b=await makePngBlob();if(d&&b)downloadBlob(b,`match-${formatDate(getDate()).replaceAll('/','-')}-${safeName(d.home?.name)}-${safeName(d.away?.name)}.png`)}
    async function sharePng(){const d=readMatch(),b=await makePngBlob();if(!d||!b)return;const file=new File([b],`match-${safeName(d.home?.name)}-${safeName(d.away?.name)}.png`,{type:'image/png'});try{if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]})))await navigator.share({files:[file],title:`${d.home?.name||'בית'} - ${d.away?.name||'חוץ'}`,text:`סיכום משחק · ${formatDate(getDate())}`});else downloadBlob(b,file.name)}catch(e){if(e?.name!=='AbortError')downloadBlob(b,file.name)}}
    function printReport(){const d=readMatch();if(!d)return;const ev=chronological(d.events),date=getDate(),lg=logos(),w=window.open('','_blank','width=950,height=900');if(!w)return;const logo=s=>lg[s]?.dataUrl?`<img src="${lg[s].dataUrl}">`:'';const rows=ev.map(e=>{if(e.kind==='stage'||!e.team)return `<div class="stage">${esc(e.minute||'')} · ${esc(e.title||kindNames[e.kind]||'')}</div>`;return `<div class="row"><div class="side away">${e.team==='away'?`${esc(e.title||'')}<small>${esc(e.detail||'')}</small>`:''}</div><b>${esc(e.minute||'')}</b><div class="side home">${e.team==='home'?`${esc(e.title||'')}<small>${esc(e.detail||'')}</small>`:''}</div></div>`}).join('');w.document.write(`<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>סיכום משחק</title><style>body{font-family:Arial,sans-serif;color:#17243d;padding:30px}.date,.meta{text-align:center;color:#667085}.score{direction:ltr;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;margin:25px 0}.team{direction:rtl;font-weight:800;font-size:22px}.team img{display:block;width:60px;height:60px;object-fit:contain;margin:0 auto 7px}.num{font-size:52px;font-weight:900}.timeline{position:relative;margin-top:24px}.timeline:before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:1px solid #ccd3d8}.row{display:grid;grid-template-columns:1fr 58px 1fr;direction:ltr;min-height:62px;align-items:center}.row>b{text-align:center;background:white;z-index:1}.side{direction:rtl;padding:7px 14px;font-weight:700}.side small{display:block;color:#7b8490;font-weight:400;margin-top:3px}.away{text-align:right}.home{text-align:right}.stage{position:relative;z-index:2;width:max-content;margin:10px auto;padding:5px 15px;border:1px solid #bac2c8;border-radius:20px;background:white;font-weight:700}@media print{body{padding:0}}</style></head><body><h1 style="text-align:center">סיכום משחק</h1><div class="date">${esc(fullDate(date))} · ${isEnded()?'תוצאת סיום':esc(stageNames[d.stage]||'')}</div><div class="score"><div class="team">${logo('away')}${esc(d.away?.name||'קבוצת חוץ')}</div><div class="num">${Number(d.awayScore)||0} : ${Number(d.homeScore)||0}</div><div class="team">${logo('home')}${esc(d.home?.name||'קבוצת בית')}</div></div><div class="meta">זמן משחק ${formatClock(d.elapsed)}</div><div class="timeline">${rows||'<p style="text-align:center">לא נרשמו אירועים</p>'}</div><script>window.onload=()=>setTimeout(()=>window.print(),180)<\/script></body></html>`);w.document.close()}
    async function resizeLogo(file){return new Promise((resolve,reject)=>{const reader=new FileReader;reader.onload=()=>{const img=new Image;img.onload=()=>{const size=256,cv=document.createElement('canvas');cv.width=cv.height=size;const c=cv.getContext('2d');c.clearRect(0,0,size,size);const s=Math.min(size/img.width,size/img.height),w=img.width*s,h=img.height*s;c.drawImage(img,(size-w)/2,(size-h)/2,w,h);resolve(cv.toDataURL('image/png'))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
    async function saveLogo(side,file){if(!file||!file.type.startsWith('image/'))return;try{const dataUrl=await resizeLogo(file),all=logos(),d=readMatch();all[side]={dataUrl,teamName:d?.[side]?.name||side};writeJson(LOGO_KEY,all);showToast('הלוגו נשמר');enhanceIframe();if(backdrop.classList.contains('open'))openReport()}catch{showToast('לא ניתן לקרוא את התמונה')}}
    function iframeStyle(doc){if(doc.getElementById('reportEnhanceStyle'))return;const s=doc.createElement('style');s.id='reportEnhanceStyle';s.textContent=`.external-logo-tools{display:flex;align-items:center;gap:8px;margin-top:10px}.external-logo-label{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 11px;border:1px dashed #62747a;border-radius:9px;color:#c9d4d7;font-size:12px;font-weight:700;cursor:pointer}.external-logo-label input{display:none}.external-logo-preview{width:38px;height:38px;object-fit:contain}.injected-team-logo{width:50px;height:50px;object-fit:contain;margin:0 auto 7px}.external-end-game{min-height:56px;border-radius:15px!important;border:1px solid #ef6b6b55!important;background:#31191b!important;color:#ffaaaa!important;font-weight:900!important}.external-ended{border-color:#5ee59a55!important;background:#123428!important;color:#9df0bd!important}@media(max-width:650px){.injected-team-logo{width:42px;height:42px}.external-end-game{grid-column:1/-1;width:100%}}`;doc.head.appendChild(s)}
    function addLogoUploader(fieldset,side){if(fieldset.dataset.logoEnhanced)return;fieldset.dataset.logoEnhanced='1';const box=document.createElement('div');box.className='external-logo-tools';const l=logos()[side];box.innerHTML=`${l?.dataUrl?`<img class="external-logo-preview" src="${l.dataUrl}" alt="">`:''}<label class="external-logo-label">▣ ${l?.dataUrl?'החלפת לוגו':'העלאת לוגו'}<input type="file" accept="image/*"></label>`;box.querySelector('input').addEventListener('change',e=>saveLogo(side,e.target.files?.[0]));fieldset.appendChild(box)}
    function enhanceIframe(){let doc;try{doc=frame.contentDocument}catch{return}if(!doc?.body)return;iframeStyle(doc);doc.querySelectorAll('.team-setup').forEach((fs,i)=>{const text=fs.querySelector('legend')?.textContent||'';addLogoUploader(fs,text.includes('בית')?'home':text.includes('חוץ')?'away':i===0?'home':'away')});const scores=doc.querySelectorAll('.team-score'),lg=logos();scores.forEach((el,i)=>{const side=i===0?'home':'away',src=lg[side]?.dataUrl,existing=el.querySelector('.injected-team-logo');if(src&&!existing){const img=doc.createElement('img');img.className='injected-team-logo';img.src=src;img.alt='לוגו הקבוצה';el.insertBefore(img,el.firstChild)}else if(src&&existing&&existing.src!==src)existing.src=src;else if(!src&&existing)existing.remove()});const controls=doc.querySelector('.controls');if(controls&&!controls.querySelector('.external-end-game')){const b=doc.createElement('button');b.type='button';b.className='external-end-game';b.addEventListener('click',()=>isEnded()?openReport():openEndConfirm());controls.appendChild(b)}const b=controls?.querySelector('.external-end-game');if(b){b.textContent=isEnded()?'✓ המשחק הסתיים · סיכום':'■ סיום המשחק';b.classList.toggle('external-ended',isEnded())}}
    function openEndConfirm(){endConfirm.classList.add('open');endConfirm.setAttribute('aria-hidden','false')}
    function closeEndConfirm(){endConfirm.classList.remove('open');endConfirm.setAttribute('aria-hidden','true')}
    function finishMatch(){const d=readMatch();if(!d||d.screen!=='match')return closeEndConfirm();let elapsed=Number(d.elapsed)||0;if(d.isRunning&&d.savedAt)elapsed+=Math.max(0,Math.floor((Date.now()-Number(d.savedAt))/1000));d.elapsed=elapsed;d.isRunning=false;d.savedAt=Date.now();localStorage.setItem(STORAGE_KEY,JSON.stringify(d));writeJson(META_KEY,{ended:true,endedAt:Date.now()});closeEndConfirm();frame.onload=()=>{setTimeout(()=>{enhanceIframe();openReport();frame.onload=null},250)};frame.contentWindow.location.reload()}
    function update(){const d=readMatch();ensureDate();launch.classList.toggle('visible',!!(d&&d.screen==='match'));enhanceIframe()}
    document.getElementById('reportClose').onclick=closeReport;launch.onclick=openReport;backdrop.addEventListener('mousedown',e=>e.target===backdrop&&closeReport());document.getElementById('cancelEnd').onclick=closeEndConfirm;document.getElementById('confirmEnd').onclick=finishMatch;endConfirm.addEventListener('mousedown',e=>e.target===endConfirm&&closeEndConfirm());document.getElementById('downloadCsv').onclick=downloadCsv;document.getElementById('downloadPng').onclick=downloadPng;document.getElementById('printReport').onclick=printReport;shareButton.onclick=sharePng;document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeReport();closeEndConfirm()}});frame.addEventListener('load',()=>setTimeout(enhanceIframe,100));setInterval(update,650);update();
  })();
  </script>
